# The `product` Workflow (greenfield): the flow aidw runs TODAY, described as data (docs/factory-architecture.md, section 8).
# It adds no stage. The CLI reads `transitions` and the build `agents` from here. Check with `aidw roster`.
#
#   applies_to  the project kind (`kind:` in .aidw/project.yaml) this Workflow serves
#   existing    Artifacts that may exist before the Change starts (written by `aidw init` or by earlier Changes)
#   stages      in order. A stage names the Change states it covers, the Roles that do the work, the Artifacts it
#               reads (written by an earlier stage, or existing) and writes (each owned by one of the stage's Roles)
#   gate        approval: only the user passes it (/aidw:approve); production-deploy: a production deploy asks first
#   transitions the Change state machine (see below)
#   agents      the Agents the CLI tells the orchestrator to spawn (the build stage of product.yaml is what the CLI reads)
# Every Role named here is active. A Role behind a Decision Point (research, ux-research, database-architect, api-designer)
# runs on a Change only when that decision says so.
id: product
description: Greenfield request to delivered software, with one approval gate after the plan.
applies_to: greenfield
existing: [project-config]
# Scope round (ADR-0011): the user settles vision, scope, MVP and what is out on a Decision Page (`kind: scope`) during the
# discovery interview, before any requirement is written. The checked answer is recorded under `### Scope round` in the
# discovery appendix of analysis.md. A Change created under this Workflow records `scope_round: true`, and
# `aidw analyze` refuses its package without the round. Nothing is approved or frozen there:
# the one Approval Gate stays after the plan.
scope_round: true
interrupts: [paused, escalated]

# The Change state machine of this Workflow: from each state, the states `aidw transition` may move to. `approved` is reached by
# `aidw approve` and `archived` by `aidw archive`, so no state lists them. The CLI reads this table (src/machine.ts).
transitions:
  draft: [intake]
  intake: [analyzing]
  analyzing: [awaiting_approval]
  awaiting_approval: [analyzing]
  approved: [executing]
  executing: [verifying, paused, escalated]
  paused: []
  verifying: [executing, converging, paused, escalated]
  converging: [executing, deploying, paused, escalated]
  deploying: [delivered, paused, escalated]
  delivered: [executing]  # /aidw:resume finishes a draft pull request (D12)
  archived: []
  escalated: [executing, verifying, converging, deploying, analyzing]

# States in which the approved package must exist and match its hash, and in which intake, analysis, tasks and quality
# files must exist. `archived` needs the package but not a live approval (it is the end of the Change).
approval_required: [approved, executing, paused, verifying, converging, deploying, delivered, escalated]
analysis_required: [awaiting_approval, approved, executing, paused, verifying, converging, deploying, delivered, escalated, archived]

# Decision Points: where one Role chooses from a fixed set. `aidw decide` records the answer and the reason in
# decisions.yaml of the Change (part of the approved package, so the user sees it at the gate); an answer outside
# `options` is refused. required: `aidw analyze` refuses a package without the answer.
decisions:
  - id: design-needed
    decide: ui-ux-designer
    options: [full-design, reuse-existing, no-ui]
    stage: design
    required: false
  # The four Roles below are optional on a Change: the deciding Role says whether this Change needs them. Not answered = none.
  - id: research-needed
    decide: product-manager
    options: [market, feasibility, both, none]
    stage: research
    required: false
  - id: ux-research-needed
    decide: product-manager
    options: [journeys, none]
    stage: user-research
    required: false
  - id: data-model-needed
    decide: software-architect
    options: [design, none]
    stage: contracts
    required: false
  - id: api-contract-needed
    decide: software-architect
    options: [openapi, actions, none]
    stage: contracts
    required: false

stages:
  - id: intake
    title: Intake
    states: [draft, intake]
    roles: [product-manager]
    writes: [intake]

  - id: discovery
    title: Discovery interview, one conversation in stages (the job and its scope round, the rules and edges, the users)
    states: [analyzing]
    roles: [product-manager, business-analyst, ux-research]
    reads: [intake]
    writes: [analysis-discovery-qa, analysis-deferred-to-architecture]

  - id: research
    title: Research, when the Product Manager decides the Change needs it
    states: [analyzing]
    roles: [product-manager, research]
    reads: [intake, analysis-discovery-qa]
    writes: [decision-research-needed, research-note]

  - id: user-research
    title: User kinds, journeys and usability requirements, when the Product Manager decides the Change needs them
    states: [analyzing]
    roles: [product-manager, ux-research]
    reads: [intake, analysis-discovery-qa]
    writes: [decision-ux-research-needed, user-journeys]

  - id: requirements
    title: Domain model and requirements (Product Manager), then delta specs (Business Analyst)
    states: [analyzing]
    roles: [product-manager, business-analyst]
    reads: [intake, analysis-discovery-qa, research-note, user-journeys]
    writes: [domain-model, decisions-domain, requirements, delta-specs, analysis-scope, analysis-before-after, analysis-domain, analysis-specs]

  - id: design
    title: Design decision and tokens
    states: [analyzing]
    roles: [ui-ux-designer]
    reads: [requirements, delta-specs]
    writes: [design-direction, design-tokens, decision-design-needed, analysis-design]
    browser: true # screenshots the mocks in the test browser (aidw mock shots); one browser user at a time

  - id: architecture
    title: Stack, architecture and constitution
    states: [analyzing]
    roles: [software-architect]
    reads: [analysis-deferred-to-architecture, requirements, delta-specs, domain-model, design-direction, design-tokens, project-config]
    writes: [architecture, decisions-architecture, constitution, project-config, analysis-stack, analysis-architecture]

  - id: system-design-round
    title: System design round, the open Design Questions put to the user (none for Size small)
    states: [analyzing]
    roles: [software-architect]
    reads: [architecture, analysis-architecture]
    writes: [analysis-system-design-round, analysis-architecture, architecture, decisions-architecture]

  - id: contracts
    title: Data model and API contract, each when the Software Architect decides the Change needs it
    states: [analyzing]
    roles: [software-architect, database-architect, api-designer]
    reads: [requirements, delta-specs, domain-model, architecture, constitution]
    writes: [decision-data-model-needed, decision-api-contract-needed, data-model-dbml, data-model-notes, api-contract-openapi, api-contract-notes]

  - id: program-design
    title: Program Design, the files and the main signatures and contracts (the short one for Size small)
    states: [analyzing]
    roles: [software-architect]
    reads: [analysis-system-design-round, architecture, constitution, delta-specs, data-model-notes, api-contract-notes]
    writes: [program-design]

  - id: plan
    title: Task graph
    states: [analyzing]
    roles: [technical-planner, research] # Research writes the Docs Briefs the tasks name in docs: (ADR-0016)
    reads: [delta-specs, architecture, constitution, design-tokens, data-model-notes, api-contract-notes, program-design]
    writes: [tasks, analysis-plan, docs-brief]

  - id: quality-profile
    title: Test plan, quality layers, deploy strategy and permissions
    states: [analyzing]
    roles: [qa, release]
    reads: [delta-specs, tasks, architecture]
    writes: [test-plan, quality, analysis-quality-profile, analysis-deploy-strategy, analysis-permissions]

  - id: plan-review
    title: Independent review of architecture and plan against a fixed list, after aidw analyze (at most 2 fix rounds)
    states: [analyzing]
    roles: [code-reviewer]
    reads: [requirements, delta-specs, analysis-scope, architecture, constitution, data-model-notes, api-contract-notes, program-design, tasks, test-plan, quality]
    writes: [plan-review]

  - id: approval
    title: Analyze, present and approve
    states: [awaiting_approval, approved]
    roles: [product-manager]
    reads: [intake, analysis-discovery-qa, requirements, delta-specs, architecture, program-design, tasks, quality]
    writes: [analysis-summary, analysis-decisions-to-honor, analysis-risks]
    gate: approval

  - id: build
    title: Build, one task at a time, each reviewed
    states: [executing]
    roles: [fullstack, frontend, backend, database, devops, integration, code-reviewer, software-architect]
    reads: [tasks, delta-specs, constitution, architecture, program-design, design-tokens]
    writes: [task-review, triage-report]
    agents:
      implement: fullstack
      review: code-reviewer
      triage: software-architect
      layer-review: { ui: ui-ux-designer, security: security, performance: performance }

  - id: verify
    title: Quality layers
    states: [verifying]
    roles: [security, ui-ux-designer, performance]
    reads: [delta-specs, architecture, constitution, design-tokens]
    writes: [layer-review-security, layer-review-ui-ux, layer-review-performance]

  - id: converge
    title: Every scenario has a passing test
    states: [converging]
    roles: []
    reads: [delta-specs, tasks]

  - id: deploy
    title: Deploy and smoke checks
    states: [deploying]
    roles: []
    gate: production-deploy

  - id: deliver
    title: Release plan, documentation, delivery package and archive
    states: [delivered, archived]
    roles: [release, documentation]
    reads: [delta-specs, requirements, tasks, quality, architecture]
    writes: [release-plan]
