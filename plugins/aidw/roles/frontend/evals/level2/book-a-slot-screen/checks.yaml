# Machine checks of a level 2 run, after the held-out tests. Each command runs in the temp copy with `sh -c`; the
# plugin's bin/ is first on PATH, $AIDW_BASE is the commit the Agent started from, and $AIDW_CHANGED names a file that
# lists the files the session changed. A check passes when the command exits with `exit` (default 0), its stdout parsed
# as JSON contains `json` (a subset; a string "/re/" is a regex) and its output matches `matches` (a regex), each when
# given.
checks:
  - name: no control without a name and no clickable div in the added code (F4, a11y-names)
    # --base: only the lines added since the base commit, so DayList's own <div onClick> is not counted. A script that
    # is missing or fails prints no JSON, and the parse fails the check.
    run: >-
      node "$(aidw plugin-path roles/frontend/scripts/a11y-names.mjs)" --base "$AIDW_BASE" . |
      node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{const bad=JSON.parse(s).findings.filter((f)=>f.problem==="no-name"||f.problem==="div-click");if(bad.length){console.log(JSON.stringify(bad));process.exit(1)}})'
  - name: no literal that is not a token in the added styles (F2, token-literals)
    run: >-
      node "$(aidw plugin-path roles/frontend/scripts/token-literals.mjs)" --base "$AIDW_BASE" . |
      node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{const bad=JSON.parse(s).findings;if(bad.length){console.log(JSON.stringify(bad));process.exit(1)}})'
  - name: every scenario id names a test in tests/booking
    run: >-
      for id in slots-loading open-slots-of-a-day pick-a-slot close-without-booking confirm-the-booking
      slot-taken-meanwhile slots-fail-to-load no-slots-on-the-day;
      do grep -rqF "booking/book-a-slot/$id" tests/booking || { echo "no test names booking/book-a-slot/$id"; exit 1; }; done
  - name: the whole suite passes
    run: npm test
  - name: the typecheck passes
    run: npm run typecheck
  - name: nothing outside Touches changed (no file of src/ui/ or the test harness)
    # Against the base commit, so a commit cannot hide a change. $AIDW_CHANGED lists the files the session changed, taken
    # before the harness put back the files the grading runs; run by hand, the list is taken from git.
    run: >-
      changed=$(if [ -n "$AIDW_CHANGED" ]; then cat "$AIDW_CHANGED"; else git diff --name-only "$AIDW_BASE";
      git ls-files --others --exclude-standard; fi);
      out=$(printf '%s\n' "$changed" | grep -vE '^(src/booking/|tests/booking/|tests/held-out/|src/routes\.tsx$|\.aidw/(run|changes)/)' | grep -v '^$');
      test -z "$out" || { echo "$out"; exit 1; }
