# The Roster: every Role the factory declares (docs/factory-architecture.md, section 2).
# status      active  = workflows may give it work
#             planned = declared; its work is done by `carried_by` until it is activated
# carried_by  a Role id, or `cli` / `skill:<name>` when deterministic code or a user command does the work today
# A Role's profile lives in roles/<id>/role.md. Check with `aidw roster`.
departments:
  product-analysis: Product & Analysis
  architecture-planning: Architecture & Planning
  implementation: Implementation
  quality-delivery: Quality & Delivery

roles:
  product-manager: { department: product-analysis, status: active }
  business-analyst: { department: product-analysis, status: planned, carried_by: product-manager }
  research: { department: product-analysis, status: planned, carried_by: product-manager }
  ux-research: { department: product-analysis, status: planned, carried_by: product-manager }

  ui-ux-designer: { department: architecture-planning, status: active }
  software-architect: { department: architecture-planning, status: active }
  database-architect: { department: architecture-planning, status: planned, carried_by: software-architect }
  api-designer: { department: architecture-planning, status: planned, carried_by: software-architect }
  technical-planner: { department: architecture-planning, status: active }

  frontend: { department: implementation, status: active }
  backend: { department: implementation, status: active }
  fullstack: { department: implementation, status: active }
  database: { department: implementation, status: active }
  integration: { department: implementation, status: active }
  devops: { department: implementation, status: active }

  qa: { department: quality-delivery, status: planned, carried_by: cli }
  code-reviewer: { department: quality-delivery, status: active }
  security: { department: quality-delivery, status: active }
  performance: { department: quality-delivery, status: planned, carried_by: cli }
  documentation: { department: quality-delivery, status: planned, carried_by: "skill:deliver" }
  release: { department: quality-delivery, status: planned, carried_by: cli }
