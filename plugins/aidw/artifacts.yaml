# The Artifact registry (docs/factory-architecture.md, section 6): every file a Role hands to the next one.
# Check with `aidw roster`.
#
#   path      inside .aidw/ (<id> = change id, <T> = task id, <capability>, NNNN-<slug> are placeholders)
#   owner     exactly ONE Role writes it; a Role's `writes:` header lists only what it owns, `reads:` any artifact
#   validate  how it is checked: `aidw validate` | `aidw analyze` | `aidw plan` | `none` (the user reads it at the gate)
#   part      only when several artifacts share one file or folder: which part this one is (the heading of an
#             analysis.md section, or what kind of ADR). Two artifacts never share a path without a `part`.
#
# Owners are the Roles that do the work today. `qa` and `release` are Planned Roles: the registry names them as
# the true owners while the main session carries the work (carried_by in roster.yaml).

# --- Intake and discovery ------------------------------------------------------------------------------------
intake:
  path: changes/<id>/intake.md
  owner: product-manager
  validate: aidw analyze

# --- analysis.md: one file, one owner per section --------------------------------------------------------------
analysis-summary:
  path: changes/<id>/analysis.md
  part: "## Summary"
  owner: product-manager
  validate: aidw analyze
