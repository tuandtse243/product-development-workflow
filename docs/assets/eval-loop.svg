<text x="810" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">digest of the Role</text>
<text x="750" y="102" fill="#38bdf8" font-size="12" font-weight="700">5</text></g><rect x="250" y="278" width="400" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
<text x="450" y="298" text-anchor="middle" fill="#e2e8f0" font-size="13">On a failure, find the cause</text>
<text x="450" y="314" text-anchor="middle" fill="#94a3b8" font-size="11">fix the Role or the case itself; re-run only failed cases</text><circle r="8" fill="#38bdf8"><animateMotion dur="12s" repeatCount="indefinite" path="M90 152 H810 V300 H90 Z"/></circle></svg>
