<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="Evals: does the agent really follow the Role?">
<rect width="900" height="400" rx="14" fill="#0f172a"/>
<text x="30" y="40" fill="#e2e8f0" font-size="20" font-weight="700">Evals: does the agent really follow the Role?</text><text x="30" y="64" fill="#94a3b8" font-size="14">Writing the instructions is not enough. Every rule and skill needs a case that proves the agent follows it.</text><path d="M90 152 H810 V300 H90 Z" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><g><rect x="20" y="110" width="140" height="84" rx="10" fill="#1e293b" stroke="#475569"/>
<rect x="20" y="110" width="140" height="84" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.07;1" values="0;0;0"/></rect>
<text x="90" y="142" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Write a case</text>
<text x="90" y="164" text-anchor="middle" fill="#94a3b8" font-size="11">a scenario with a trap</text>
<text x="90" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">covers: X1..X7</text>
<text x="30" y="102" fill="#38bdf8" font-size="12" font-weight="700">1</text></g><g><rect x="200" y="110" width="140" height="84" rx="10" fill="#1e293b" stroke="#475569"/>
<rect x="200" y="110" width="140" height="84" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.07368663594470046;0.10368663594470046;0.17368663594470046;1" values="0;0;1;0;0"/></rect>
<text x="270" y="142" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Level 1</text>
<text x="270" y="164" text-anchor="middle" fill="#94a3b8" font-size="11">the agent answers</text>
<text x="270" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">in text; a model grades</text>
<text x="210" y="102" fill="#38bdf8" font-size="12" font-weight="700">2</text></g><g><rect x="380" y="110" width="140" height="84" rx="10" fill="#1e293b" stroke="#475569"/>
<rect x="380" y="110" width="140" height="84" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.1773732718894009;0.2073732718894009;0.2773732718894009;1" values="0;0;1;0;0"/></rect>
<text x="450" y="142" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Level 2</text>
<text x="450" y="164" text-anchor="middle" fill="#94a3b8" font-size="11">a real session on a</text>
<text x="450" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">fixture repo</text>
<text x="390" y="102" fill="#38bdf8" font-size="12" font-weight="700">3</text></g><g><rect x="560" y="110" width="140" height="84" rx="10" fill="#1e293b" stroke="#475569"/>
<rect x="560" y="110" width="140" height="84" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.2810599078341014;0.31105990783410137;0.3810599078341014;1" values="0;0;1;0;0"/></rect>
<text x="630" y="142" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Grade</text>
<text x="630" y="164" text-anchor="middle" fill="#94a3b8" font-size="11">held-out tests, scripts,</text>
<text x="630" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">tool log; 3 runs</text>
<text x="570" y="102" fill="#38bdf8" font-size="12" font-weight="700">4</text></g><g><rect x="740" y="110" width="140" height="84" rx="10" fill="#1e293b" stroke="#475569"/>
<rect x="740" y="110" width="140" height="84" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.3847465437788018;0.4147465437788018;0.48474654377880183;1" values="0;0;1;0;0"/></rect>
<text x="810" y="142" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">results.json</text>
