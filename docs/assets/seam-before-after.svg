<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="Before and after: do the two halves of a Slice meet?">
<rect width="900" height="470" rx="14" fill="#0f172a"/>
<text x="30" y="40" fill="#e2e8f0" font-size="20" font-weight="700">Before and after: do the two halves of a Slice meet?</text><text x="30" y="90" fill="#f87171" font-size="15" font-weight="700">BEFORE: each half passes alone, together they are broken</text><rect x="30" y="104" width="230" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="145" y="134" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Screen (client)</text>
<text x="145" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">reads body.message</text>
<text x="145" y="174" text-anchor="middle" fill="#94a3b8" font-size="11">tested with a hand-written fake body</text>
<rect x="640" y="104" width="230" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="755" y="134" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Server (real handler)</text>
<text x="755" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">returns {error:{fields:{name:"taken"}}}</text>
<text x="755" y="174" text-anchor="middle" fill="#94a3b8" font-size="11">route test is green</text><line x1="260" y1="149" x2="640" y2="149" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><text x="450" y="137" text-anchor="middle" fill="#94a3b8" font-size="11">no test crosses this line</text><circle r="8" fill="#38bdf8"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;0;0" keyTimes="0;0.35;0.7;1" calcMode="linear" path="M260 149 H640"/></circle><text x="450" y="224" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700" opacity="0">✗ the Name field shows nothing, the user sees no error<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.7;0.78;0.97;1" values="0;0;1;1;0"/></text><text x="30" y="290" fill="#4ade80" font-size="15" font-weight="700">AFTER (rules X1, X2, X6): one test goes from the screen into the real handler</text><rect x="30" y="304" width="230" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="145" y="334" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Screen (client)</text>
<text x="145" y="356" text-anchor="middle" fill="#94a3b8" font-size="11">reads error.fields.name</text>
<text x="145" y="374" text-anchor="middle" fill="#94a3b8" font-size="11">one test crosses (X1)</text>
<rect x="640" y="304" width="230" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="755" y="334" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Server (real handler)</text>
<text x="755" y="356" text-anchor="middle" fill="#94a3b8" font-size="11">returns {error:{fields:{name:"taken"}}}</text>
<text x="755" y="374" text-anchor="middle" fill="#94a3b8" font-size="11">same zod schema as the client (X2)</text><line x1="260" y1="349" x2="640" y2="349" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/><text x="450" y="337" text-anchor="middle" fill="#94a3b8" font-size="11">MSW forwards /api/* to the real Express app, no socket</text><circle r="8" fill="#38bdf8"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;0;0" keyTimes="0;0.35;0.7;1" calcMode="linear" path="M260 349 H640"/></circle><text x="450" y="424" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700" opacity="0">✓ the error shows in the Name field: name taken<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.7;0.78;0.97;1" values="0;0;1;1;0"/></text></svg>
